<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="660" viewBox="0 0 760 660" font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif">
  <title>Workflow of a Business Rollout in the fiskaltrust.Portal</title>
  <desc>Flowchart: the PosDealer opens Rollout management and chooses Business Rollout, selects the rollout plan, selects the PosOperators and outlets, creates the quote and loads it into the cart, and completes the checkout.</desc>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#002A34"/></marker></defs>
  <rect x="0" y="0" width="760" height="660" fill="#FFFFFF"/>
  <rect x="20" y="20" width="720" height="620" fill="#FFFFFF" stroke="#002A34" stroke-width="1.5"/>
  <line x1="20" y1="56" x2="740" y2="56" stroke="#002A34" stroke-width="1.5"/>
  <text text-anchor="start" font-size="18" font-weight="600" fill="#002A34"><tspan x="36" y="44.3">Workflow - Business Rollout</tspan></text>
  <rect x="20" y="56" width="720" height="34" fill="#E5E6E7" stroke="#002A34" stroke-width="1.5"/>
  <text text-anchor="middle" font-size="16" font-weight="600" fill="#002A34"><tspan x="380.0" y="78.6">PosDealer · fiskaltrust.Portal</tspan></text>
  <rect x="230.0" y="118.0" width="300" height="64" rx="10" fill="#FFFFFF" stroke="#002A34" stroke-width="1.5"/><text text-anchor="middle" font-size="16" fill="#002A34"><tspan x="380" y="145.2">Open Rollout management</tspan><tspan x="380" y="166.0">and choose Business Rollout</tspan></text>
  <rect x="230.0" y="228.0" width="300" height="64" rx="10" fill="#FFFFFF" stroke="#002A34" stroke-width="1.5"/><text text-anchor="middle" font-size="16" fill="#002A34"><tspan x="380" y="265.6">Select the rollout plan</tspan></text>
  <rect x="230.0" y="338.0" width="300" height="64" rx="10" fill="#FFFFFF" stroke="#002A34" stroke-width="1.5"/><text text-anchor="middle" font-size="16" fill="#002A34"><tspan x="380" y="365.2">Select the PosOperators</tspan><tspan x="380" y="386.0">and outlets</tspan></text>
  <rect x="230.0" y="448.0" width="300" height="64" rx="10" fill="#FFFFFF" stroke="#002A34" stroke-width="1.5"/><text text-anchor="middle" font-size="16" fill="#002A34"><tspan x="380" y="475.2">Create the quote and</tspan><tspan x="380" y="496.0">load it into the cart</tspan></text>
  <rect x="250.0" y="560.0" width="260" height="60" rx="30.0" fill="#FFFFFF" stroke="#002A34" stroke-width="1.5"/><text text-anchor="middle" font-size="16" fill="#002A34"><tspan x="380" y="595.6">Complete the checkout</tspan></text>
  <path d="M380,182 V226" fill="none" stroke="#002A34" stroke-width="1.5" marker-end="url(#ah)"/>
  <path d="M380,292 V336" fill="none" stroke="#002A34" stroke-width="1.5" marker-end="url(#ah)"/>
  <path d="M380,402 V446" fill="none" stroke="#002A34" stroke-width="1.5" marker-end="url(#ah)"/>
  <path d="M380,512 V560" fill="none" stroke="#002A34" stroke-width="1.5" marker-end="url(#ah)"/>
</svg>
