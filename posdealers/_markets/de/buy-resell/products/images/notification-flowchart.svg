<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1110" viewBox="0 0 1240 1110" font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif">
  <title>Workflow of the tax authority notifications in Germany</title>
  <desc>Flowchart: the PosDealer opens PosDealer, PosOperator Notifications and checks the subscription of the PosOperator. Without an active subscription, the PosDealer buys or extends it. With an active subscription, the PosDealer enables notifications, which sends the onboarding email to the PosOperator. The PosOperator updates the data in the form, fixes any data issues and submits the form. The PosDealer monitors the notification status.</desc>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#002A34"/></marker></defs>
  <rect x="0" y="0" width="1240" height="1110" fill="#FFFFFF"/>
  <rect x="20" y="20" width="1200" height="1070" fill="#FFFFFF" stroke="#002A34" stroke-width="1.5"/>
  <line x1="20" y1="56" x2="1220" y2="56" stroke="#002A34" stroke-width="1.5"/>
  <text text-anchor="start" font-size="18" font-weight="600" fill="#002A34"><tspan x="36" y="44.3">Workflow - tax authority notifications in Germany</tspan></text>
  <rect x="20" y="56" width="680" height="34" fill="#E5E6E7" stroke="#002A34" stroke-width="1.5"/>
  <text text-anchor="middle" font-size="16" font-weight="600" fill="#002A34"><tspan x="360.0" y="78.6">PosDealer · fiskaltrust.Portal</tspan></text>
  <rect x="700" y="56" width="520" height="34" fill="#E5F6FB" stroke="#002A34" stroke-width="1.5"/>
  <text text-anchor="middle" font-size="16" font-weight="600" fill="#002A34"><tspan x="960.0" y="78.6">PosOperator</tspan></text>
  <line x1="700" y1="90" x2="700" y2="1090" stroke="#002A34" stroke-width="1.5"/>
  <rect x="120.0" y="118.0" width="260" height="64" rx="10" fill="#FFFFFF" stroke="#002A34" stroke-width="1.5"/><text text-anchor="middle" font-size="16" fill="#002A34"><tspan x="250" y="145.2">Open PosDealer &gt;</tspan><tspan x="250" y="166.0">PosOperator Notifications</tspan></text>
  <rect x="120.0" y="228.0" width="260" height="64" rx="10" fill="#FFFFFF" stroke="#002A34" stroke-width="1.5"/><text text-anchor="middle" font-size="16" fill="#002A34"><tspan x="250" y="255.2">Check the PosOperator's</tspan><tspan x="250" y="276.0">subscription</tspan></text>
  <polygon points="250,338 380,400 250,462 120,400" fill="#FDF0D6" stroke="#002A34" stroke-width="1.5"/><text text-anchor="middle" font-size="15" fill="#002A34"><tspan x="250" y="395.5">Subscription</tspan><tspan x="250" y="415.0">active?</tspan></text>
  <rect x="470.0" y="368.0" width="200" height="64" rx="10" fill="#FFFFFF" stroke="#002A34" stroke-width="1.5"/><text text-anchor="middle" font-size="16" fill="#002A34"><tspan x="570" y="395.2">Buy or extend the</tspan><tspan x="570" y="416.0">subscription</tspan></text>
  <rect x="120.0" y="508.0" width="260" height="64" rx="10" fill="#FFFFFF" stroke="#002A34" stroke-width="1.5"/><text text-anchor="middle" font-size="16" fill="#002A34"><tspan x="250" y="545.6">Enable notifications</tspan></text>
  <polygon points="786.0,508.0 1046.0,508.0 1014.0,572.0 754.0,572.0" fill="#E5F6FB" stroke="#002A34" stroke-width="1.5"/><text text-anchor="middle" font-size="16" fill="#002A34"><tspan x="900" y="535.2">Receive the</tspan><tspan x="900" y="556.0">onboarding email</tspan></text>
  <polygon points="786.0,618.0 1046.0,618.0 1014.0,682.0 754.0,682.0" fill="#E5F6FB" stroke="#002A34" stroke-width="1.5"/><text text-anchor="middle" font-size="16" fill="#002A34"><tspan x="900" y="645.2">Update the data</tspan><tspan x="900" y="666.0">in the form</tspan></text>
  <polygon points="900,718 1020,780 900,842 780,780" fill="#FDF0D6" stroke="#002A34" stroke-width="1.5"/><text text-anchor="middle" font-size="15" fill="#002A34"><tspan x="900" y="775.5">Data</tspan><tspan x="900" y="795.0">issues?</tspan></text>
  <polygon points="1059.0,748.0 1209.0,748.0 1177.0,812.0 1027.0,812.0" fill="#E5F6FB" stroke="#002A34" stroke-width="1.5"/><text text-anchor="middle" font-size="16" fill="#002A34"><tspan x="1118" y="775.2">Fix the</tspan><tspan x="1118" y="796.0">issues</tspan></text>
  <polygon points="786.0,898.0 1046.0,898.0 1014.0,962.0 754.0,962.0" fill="#E5F6FB" stroke="#002A34" stroke-width="1.5"/><text text-anchor="middle" font-size="16" fill="#002A34"><tspan x="900" y="935.6">Submit the form</tspan></text>
  <rect x="120.0" y="898.0" width="260" height="64" rx="10" fill="#FFFFFF" stroke="#002A34" stroke-width="1.5"/><text text-anchor="middle" font-size="16" fill="#002A34"><tspan x="250" y="925.2">Monitor the notification</tspan><tspan x="250" y="946.0">status</tspan></text>
  <rect x="170.0" y="1007.0" width="160" height="56" rx="28.0" fill="#FFFFFF" stroke="#002A34" stroke-width="1.5"/><text text-anchor="middle" font-size="16" fill="#002A34"><tspan x="250" y="1040.6">End</tspan></text>
  <path d="M250,182 V226" fill="none" stroke="#002A34" stroke-width="1.5" marker-end="url(#ah)"/>
  <path d="M250,292 V336" fill="none" stroke="#002A34" stroke-width="1.5" marker-end="url(#ah)"/>
  <path d="M380,400 H468" fill="none" stroke="#002A34" stroke-width="1.5" marker-end="url(#ah)"/>
  <text text-anchor="middle" font-size="13" font-family="IBM Plex Mono, monospace" letter-spacing="1.8" fill="#676A69"><tspan x="424.0" y="392.6">NO</tspan></text>
  <path d="M250,462 V506" fill="none" stroke="#002A34" stroke-width="1.5" marker-end="url(#ah)"/>
  <text text-anchor="start" font-size="13" font-family="IBM Plex Mono, monospace" letter-spacing="1.8" fill="#676A69"><tspan x="260" y="488.6">YES</tspan></text>
  <path d="M380,540 H768" fill="none" stroke="#002A34" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#ah)"/>
  <rect x="495.0" y="530" width="158" height="20" fill="#FFFFFF"/>
  <text text-anchor="middle" font-size="13" font-family="IBM Plex Mono, monospace" letter-spacing="1.8" fill="#676A69"><tspan x="574.0" y="544.5">ONBOARDING EMAIL</tspan></text>
  <path d="M900,572 V616" fill="none" stroke="#002A34" stroke-width="1.5" marker-end="url(#ah)"/>
  <path d="M900,682 V716" fill="none" stroke="#002A34" stroke-width="1.5" marker-end="url(#ah)"/>
  <path d="M1020,780 H1041" fill="none" stroke="#002A34" stroke-width="1.5" marker-end="url(#ah)"/>
  <text text-anchor="middle" font-size="13" font-family="IBM Plex Mono, monospace" letter-spacing="1.8" fill="#676A69"><tspan x="1030.5" y="772.5">YES</tspan></text>
  <path d="M1118,748 V650 H1032" fill="none" stroke="#002A34" stroke-width="1.5" marker-end="url(#ah)"/>
  <path d="M900,842 V896" fill="none" stroke="#002A34" stroke-width="1.5" marker-end="url(#ah)"/>
  <text text-anchor="start" font-size="13" font-family="IBM Plex Mono, monospace" letter-spacing="1.8" fill="#676A69"><tspan x="910" y="873.5">NO</tspan></text>
  <path d="M250,572 V896" fill="none" stroke="#002A34" stroke-width="1.5" marker-end="url(#ah)"/>
  <path d="M760,930 H382" fill="none" stroke="#002A34" stroke-width="1.5" marker-end="url(#ah)"/>
  <path d="M250,962 V1007" fill="none" stroke="#002A34" stroke-width="1.5" marker-end="url(#ah)"/>
</svg>
