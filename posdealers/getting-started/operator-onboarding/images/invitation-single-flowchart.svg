<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="970" viewBox="0 0 1120 970" font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif">
  <title>Workflow for inviting a single PosOperator in the fiskaltrust.Portal</title>
  <desc>Flowchart: the PosDealer opens PosDealer, Invitation, checks the invitation settings, clicks +Add, enters the PosOperator details and clicks Invite all PosOperators. The PosOperator accepts the e-mail invitation, activates the PosOperator role and verifies master data and outlets. The PosDealer opens PosDealer, PosOperators and checks whether the PosOperator name is an active link: if yes, the PosDealer is ready to surrogate; if no, the PosDealer opens the invitation history and resends the invitation or copies the link and sends it, and the PosOperator accepts it again.</desc>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#002A34"/></marker></defs>
  <rect x="0" y="0" width="1120" height="970" fill="#FFFFFF"/>
  <rect x="20" y="20" width="1080" height="930" fill="#FFFFFF" stroke="#002A34" stroke-width="1.5"/>
  <line x1="20" y1="56" x2="1100" y2="56" stroke="#002A34" stroke-width="1.5"/>
  <text text-anchor="start" font-size="18" font-weight="600" fill="#002A34"><tspan x="36" y="44.3">Workflow - inviting a single PosOperator</tspan></text>
  <rect x="20" y="56" width="680" height="34" fill="#E5E6E7" stroke="#002A34" stroke-width="1.5"/>
  <text text-anchor="middle" font-size="16" font-weight="600" fill="#002A34"><tspan x="360.0" y="78.6">PosDealer · fiskaltrust.Portal</tspan></text>
  <rect x="700" y="56" width="400" height="34" fill="#E5F6FB" stroke="#002A34" stroke-width="1.5"/>
  <text text-anchor="middle" font-size="16" font-weight="600" fill="#002A34"><tspan x="900.0" y="78.6">PosOperator</tspan></text>
  <line x1="700" y1="90" x2="700" y2="950" stroke="#002A34" stroke-width="1.5"/>
  <rect x="80.0" y="118.0" width="260" height="64" rx="10" fill="#FFFFFF" stroke="#002A34" stroke-width="1.5"/><text text-anchor="middle" font-size="16" fill="#002A34"><tspan x="210" y="145.2">Open PosDealer &gt;</tspan><tspan x="210" y="166.0">Invitation</tspan></text>
  <rect x="80.0" y="218.0" width="260" height="64" rx="10" fill="#FFFFFF" stroke="#002A34" stroke-width="1.5"/><text text-anchor="middle" font-size="16" fill="#002A34"><tspan x="210" y="245.2">Check the invitation</tspan><tspan x="210" y="266.0">settings</tspan></text>
  <rect x="80.0" y="318.0" width="260" height="64" rx="10" fill="#FFFFFF" stroke="#002A34" stroke-width="1.5"/><text text-anchor="middle" font-size="16" fill="#002A34"><tspan x="210" y="345.2">Click +Add and enter</tspan><tspan x="210" y="366.0">the PosOperator details</tspan></text>
  <rect x="80.0" y="418.0" width="260" height="64" rx="10" fill="#FFFFFF" stroke="#002A34" stroke-width="1.5"/><text text-anchor="middle" font-size="16" fill="#002A34"><tspan x="210" y="445.2">Click Invite all</tspan><tspan x="210" y="466.0">PosOperators</tspan></text>
  <polygon points="786.0,418.0 1046.0,418.0 1014.0,482.0 754.0,482.0" fill="#E5F6FB" stroke="#002A34" stroke-width="1.5"/><text text-anchor="middle" font-size="16" fill="#002A34"><tspan x="900" y="445.2">Accept the e-mail</tspan><tspan x="900" y="466.0">invitation</tspan></text>
  <polygon points="786.0,518.0 1046.0,518.0 1014.0,582.0 754.0,582.0" fill="#E5F6FB" stroke="#002A34" stroke-width="1.5"/><text text-anchor="middle" font-size="16" fill="#002A34"><tspan x="900" y="545.2">Activate the</tspan><tspan x="900" y="566.0">PosOperator role</tspan></text>
  <polygon points="786.0,618.0 1046.0,618.0 1014.0,682.0 754.0,682.0" fill="#E5F6FB" stroke="#002A34" stroke-width="1.5"/><text text-anchor="middle" font-size="16" fill="#002A34"><tspan x="900" y="645.2">Verify master data</tspan><tspan x="900" y="666.0">and outlets</tspan></text>
  <rect x="80.0" y="618.0" width="260" height="64" rx="10" fill="#FFFFFF" stroke="#002A34" stroke-width="1.5"/><text text-anchor="middle" font-size="16" fill="#002A34"><tspan x="210" y="645.2">Open PosDealer &gt;</tspan><tspan x="210" y="666.0">PosOperators</tspan></text>
  <polygon points="210,708 350,770 210,832 70,770" fill="#FDF0D6" stroke="#002A34" stroke-width="1.5"/><text text-anchor="middle" font-size="15" fill="#002A34"><tspan x="210" y="765.5">PosOperator name</tspan><tspan x="210" y="785.0">is an active link?</tspan></text>
  <rect x="100.0" y="872.0" width="220" height="56" rx="28.0" fill="#FFFFFF" stroke="#002A34" stroke-width="1.5"/><text text-anchor="middle" font-size="16" fill="#002A34"><tspan x="210" y="905.6">Ready to surrogate</tspan></text>
  <rect x="400.0" y="738.0" width="260" height="64" rx="10" fill="#FFFFFF" stroke="#002A34" stroke-width="1.5"/><text text-anchor="middle" font-size="16" fill="#002A34"><tspan x="530" y="765.2">Open PosDealer &gt;</tspan><tspan x="530" y="786.0">Invitation &gt; History</tspan></text>
  <rect x="400.0" y="868.0" width="260" height="64" rx="10" fill="#FFFFFF" stroke="#002A34" stroke-width="1.5"/><text text-anchor="middle" font-size="16" fill="#002A34"><tspan x="530" y="895.2">Resend the invitation or</tspan><tspan x="530" y="916.0">copy the link and send it</tspan></text>
  <path d="M210,182 V216" fill="none" stroke="#002A34" stroke-width="1.5" marker-end="url(#ah)"/>
  <path d="M210,282 V316" fill="none" stroke="#002A34" stroke-width="1.5" marker-end="url(#ah)"/>
  <path d="M210,382 V416" fill="none" stroke="#002A34" stroke-width="1.5" marker-end="url(#ah)"/>
  <path d="M340,450 H768" fill="none" stroke="#002A34" stroke-width="1.5" marker-end="url(#ah)"/>
  <path d="M900,482 V516" fill="none" stroke="#002A34" stroke-width="1.5" marker-end="url(#ah)"/>
  <path d="M900,582 V616" fill="none" stroke="#002A34" stroke-width="1.5" marker-end="url(#ah)"/>
  <path d="M770,650 H342" fill="none" stroke="#002A34" stroke-width="1.5" marker-end="url(#ah)"/>
  <path d="M210,682 V706" fill="none" stroke="#002A34" stroke-width="1.5" marker-end="url(#ah)"/>
  <path d="M210,832 V870" fill="none" stroke="#002A34" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="189.5" y="841.0" width="41" height="20" fill="#FFFFFF"/>
  <text text-anchor="middle" font-size="13" font-family="IBM Plex Mono, monospace" letter-spacing="1.8" fill="#676A69"><tspan x="210" y="855.5">YES</tspan></text>
  <path d="M350,770 H398" fill="none" stroke="#002A34" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="358.0" y="760" width="32" height="20" fill="#FFFFFF"/>
  <text text-anchor="middle" font-size="13" font-family="IBM Plex Mono, monospace" letter-spacing="1.8" fill="#676A69"><tspan x="374.0" y="774.5">NO</tspan></text>
  <path d="M530,802 V866" fill="none" stroke="#002A34" stroke-width="1.5" marker-end="url(#ah)"/>
  <path d="M660,900 H1060 V450 H1032" fill="none" stroke="#002A34" stroke-width="1.5" marker-end="url(#ah)"/>
</svg>
