<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1140" viewBox="0 0 1120 1140" font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif">
  <title>Workflow for onboarding a PosOperator who already has an account in the fiskaltrust.Portal</title>
  <desc>Flowchart: the invitation of the PosDealer fails with the error This E-Mail address already exists. The PosOperator opens PosOperator, Search dealer/consultant, searches for the PosDealer, checks name, e-mail address and access rights and clicks Request assignment – dealer. The PosDealer opens PosDealer, PosOperators, finds the PosOperator and clicks Accept, and is then ready to surrogate.</desc>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#002A34"/></marker></defs>
  <rect x="0" y="0" width="1120" height="1140" fill="#FFFFFF"/>
  <rect x="20" y="20" width="1080" height="1100" fill="#FFFFFF" stroke="#002A34" stroke-width="1.5"/>
  <line x1="20" y1="56" x2="1100" y2="56" stroke="#002A34" stroke-width="1.5"/>
  <text text-anchor="start" font-size="18" font-weight="600" fill="#002A34"><tspan x="36" y="44.3">Workflow - onboarding a PosOperator who already has an account</tspan></text>
  <rect x="20" y="56" width="540" height="34" fill="#E5E6E7" stroke="#002A34" stroke-width="1.5"/>
  <text text-anchor="middle" font-size="16" font-weight="600" fill="#002A34"><tspan x="290.0" y="78.6">PosDealer · fiskaltrust.Portal</tspan></text>
  <rect x="560" y="56" width="540" height="34" fill="#E5F6FB" stroke="#002A34" stroke-width="1.5"/>
  <text text-anchor="middle" font-size="16" font-weight="600" fill="#002A34"><tspan x="830.0" y="78.6">PosOperator</tspan></text>
  <line x1="560" y1="90" x2="560" y2="1120" stroke="#002A34" stroke-width="1.5"/>
  <rect x="160.0" y="118.0" width="260" height="64" rx="10" fill="#FFFFFF" stroke="#002A34" stroke-width="1.5"/><text text-anchor="middle" font-size="16" fill="#002A34"><tspan x="290" y="145.2">Open PosDealer &gt;</tspan><tspan x="290" y="166.0">Invitation</tspan></text>
  <rect x="160.0" y="258.0" width="260" height="64" rx="10" fill="#FFFFFF" stroke="#002A34" stroke-width="1.5"/><text text-anchor="middle" font-size="16" fill="#002A34"><tspan x="290" y="285.2">Click Invite all</tspan><tspan x="290" y="306.0">PosOperators</tspan></text>
  <rect x="160.0" y="368.0" width="260" height="64" rx="10" fill="#FFFFFF" stroke="#ED5565" stroke-width="1.5"/><text text-anchor="middle" font-size="16" fill="#002A34"><tspan x="290" y="395.2">Error: This E-Mail</tspan><tspan x="290" y="416.0">address already exists</tspan></text>
  <polygon points="716.0,368.0 996.0,368.0 964.0,432.0 684.0,432.0" fill="#E5F6FB" stroke="#002A34" stroke-width="1.5"/><text text-anchor="middle" font-size="16" fill="#002A34"><tspan x="840" y="395.2">Open PosOperator &gt;</tspan><tspan x="840" y="416.0">Search dealer/consultant</tspan></text>
  <polygon points="716.0,478.0 996.0,478.0 964.0,542.0 684.0,542.0" fill="#E5F6FB" stroke="#002A34" stroke-width="1.5"/><text text-anchor="middle" font-size="16" fill="#002A34"><tspan x="840" y="505.2">Enter the name or e-mail</tspan><tspan x="840" y="526.0">of the PosDealer and search</tspan></text>
  <polygon points="716.0,588.0 996.0,588.0 964.0,652.0 684.0,652.0" fill="#E5F6FB" stroke="#002A34" stroke-width="1.5"/><text text-anchor="middle" font-size="16" fill="#002A34"><tspan x="840" y="615.2">Check name, e-mail</tspan><tspan x="840" y="636.0">address and access rights</tspan></text>
  <polygon points="716.0,698.0 996.0,698.0 964.0,762.0 684.0,762.0" fill="#E5F6FB" stroke="#002A34" stroke-width="1.5"/><text text-anchor="middle" font-size="16" fill="#002A34"><tspan x="840" y="725.2">Click Request</tspan><tspan x="840" y="746.0">assignment – dealer</tspan></text>
  <rect x="160.0" y="698.0" width="260" height="64" rx="10" fill="#FFFFFF" stroke="#002A34" stroke-width="1.5"/><text text-anchor="middle" font-size="16" fill="#002A34"><tspan x="290" y="725.2">Open PosDealer &gt;</tspan><tspan x="290" y="746.0">PosOperators</tspan></text>
  <rect x="160.0" y="808.0" width="260" height="64" rx="10" fill="#FFFFFF" stroke="#002A34" stroke-width="1.5"/><text text-anchor="middle" font-size="16" fill="#002A34"><tspan x="290" y="845.6">Find the PosOperator</tspan></text>
  <rect x="160.0" y="918.0" width="260" height="64" rx="10" fill="#FFFFFF" stroke="#002A34" stroke-width="1.5"/><text text-anchor="middle" font-size="16" fill="#002A34"><tspan x="290" y="955.6">Click Accept</tspan></text>
  <rect x="180.0" y="1030.0" width="220" height="56" rx="28.0" fill="#FFFFFF" stroke="#002A34" stroke-width="1.5"/><text text-anchor="middle" font-size="16" fill="#002A34"><tspan x="290" y="1063.6">Ready to surrogate</tspan></text>
  <path d="M290,182 V258" fill="none" stroke="#002A34" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#ah)"/>
  <rect x="238.0" y="210" width="104" height="20" fill="#FFFFFF"/>
  <text text-anchor="middle" font-size="13" font-family="IBM Plex Mono, monospace" letter-spacing="1.8" fill="#676A69"><tspan x="290" y="224.6">INVITATION</tspan></text>
  <path d="M290,322 V368" fill="none" stroke="#002A34" stroke-width="1.5" marker-end="url(#ah)"/>
  <path d="M420,400 H700" fill="none" stroke="#002A34" stroke-width="1.5" marker-end="url(#ah)"/>
  <path d="M840,432 V478" fill="none" stroke="#002A34" stroke-width="1.5" marker-end="url(#ah)"/>
  <path d="M840,542 V588" fill="none" stroke="#002A34" stroke-width="1.5" marker-end="url(#ah)"/>
  <path d="M840,652 V698" fill="none" stroke="#002A34" stroke-width="1.5" marker-end="url(#ah)"/>
  <path d="M700,730 H422" fill="none" stroke="#002A34" stroke-width="1.5" marker-end="url(#ah)"/>
  <path d="M290,762 V808" fill="none" stroke="#002A34" stroke-width="1.5" marker-end="url(#ah)"/>
  <path d="M290,872 V918" fill="none" stroke="#002A34" stroke-width="1.5" marker-end="url(#ah)"/>
  <path d="M290,982 V1028" fill="none" stroke="#002A34" stroke-width="1.5" marker-end="url(#ah)"/>
</svg>
