  <title>Architecture of a fiskaltrust setup: POS system, fiskaltrust.Middleware and fiskaltrust.Portal</title>
  <desc>Diagram: the POS system exchanges signatures, exports and maintenance with the fiskaltrust.Middleware via the IPOS interface; the Middleware Launcher runs the CashBox with Queue, SCU and optional Helpers, and exchanges configuration updates, packages and the receipt chain with the fiskaltrust.Portal</desc>
