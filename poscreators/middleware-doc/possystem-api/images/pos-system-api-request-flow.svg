<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="940" viewBox="-20 -20 1440 940" font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <title>End-to-end flow of a fiscal transaction between the POS system, the fiskaltrust.Middleware, signing components, and the fiskaltrust.Cloud</title>
  <desc>Sequence diagram: the POS system calls /echo, /order, /pay, /sign, /issue and /journal on the POS System API; the Middleware uses the signing component for country-specific signing and uploads the receipt chain to the cloud</desc><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#002A34"></path>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#BF8500"></path>
    </marker>
  </defs>
  <rect x="-20" y="-20" width="1440" height="940" fill="#FFFFFF"></rect>

  
  <g fill="none" stroke-width="1.5" stroke-dasharray="6 6">
    <path d="M180,84 V880" stroke="#002A34"></path>
    <path d="M700,84 V880" stroke="#007D9A"></path>
    <path d="M1220,84 V880" stroke="#BF8500"></path>
  </g>

  
  <g fill="none" stroke="#002A34" stroke-width="1.5">
    <path d="M180,150 H700" marker-end="url(#ad)"></path>
    <path d="M700,196 H180" marker-end="url(#ad)" stroke-dasharray="6 5"></path>
    <path d="M180,242 H700" marker-end="url(#ad)"></path>
    <path d="M700,288 H180" marker-end="url(#ad)" stroke-dasharray="6 5"></path>
    <path d="M180,334 H700" marker-end="url(#ad)"></path>
    <path d="M700,380 H180" marker-end="url(#ad)" stroke-dasharray="6 5"></path>
    <path d="M180,426 H700" marker-end="url(#ad)"></path>
    <path d="M700,564 H180" marker-end="url(#ad)" stroke-dasharray="6 5"></path>
    <path d="M180,610 H700" marker-end="url(#ad)"></path>
    <path d="M700,656 H180" marker-end="url(#ad)" stroke-dasharray="6 5"></path>
    <path d="M180,702 H700" marker-end="url(#ad)"></path>
    <path d="M700,840 H180" marker-end="url(#ad)" stroke-dasharray="6 5"></path>
  </g>

  
  <g fill="none" stroke="#BF8500" stroke-width="1.5">
    <path d="M700,472 H1220" marker-end="url(#aa)"></path>
    <path d="M1220,518 H700" marker-end="url(#aa)" stroke-dasharray="6 5"></path>
    <path d="M700,748 H1220" marker-end="url(#aa)"></path>
    <path d="M1220,794 H700" marker-end="url(#aa)" stroke-dasharray="6 5"></path>
  </g>

  
  <rect x="30" y="0" width="300" height="84" fill="#FFFFFF" stroke="#002A34" stroke-width="1.5"></rect>
  <text x="180" y="40" text-anchor="middle" font-size="19" font-weight="600" fill="#002A34">POS System</text>
  <text x="180" y="63" text-anchor="middle" font-size="15" fill="#676A69">Cash register</text>

  <rect x="550" y="0" width="300" height="84" fill="#E5F6FB" stroke="#7FCBE2" stroke-width="1.5"></rect>
  <text x="700" y="40" text-anchor="middle" font-size="19" font-weight="600" fill="#002A34">fiskaltrust.Middleware</text>
  <text x="700" y="63" text-anchor="middle" font-size="15" fill="#676A69">POS System API</text>

  <rect x="1070" y="0" width="300" height="84" fill="#FDF0D6" stroke="#F0C46A" stroke-width="1.5"></rect>
  <text x="1220" y="40" text-anchor="middle" font-size="19" font-weight="600" fill="#002A34">Signing component</text>
  <text x="1220" y="63" text-anchor="middle" font-size="15" fill="#676A69">SCU / TSE / RT and Cloud</text>

  
  <g text-anchor="middle" font-size="17" fill="#002A34">
    <text x="440" y="140"><tspan font-family="IBM Plex Mono, monospace" font-weight="600">/echo</tspan> (health check)</text>
    <text x="440" y="232"><tspan font-family="IBM Plex Mono, monospace" font-weight="600">/order</tspan> (register order data)</text>
    <text x="440" y="324"><tspan font-family="IBM Plex Mono, monospace" font-weight="600">/pay</tspan> (process payment)</text>
    <text x="440" y="416"><tspan font-family="IBM Plex Mono, monospace" font-weight="600">/sign</tspan> (fiscalize receipt)</text>
    <text x="440" y="600"><tspan font-family="IBM Plex Mono, monospace" font-weight="600">/issue</tspan> (generate receipt output)</text>
    <text x="440" y="692"><tspan font-family="IBM Plex Mono, monospace" font-weight="600">/journal</tspan> (audit / closing exports)</text>
  </g>

  
  <g text-anchor="middle" font-size="16" fill="#676A69">
    <text x="440" y="186">echo response</text>
    <text x="440" y="278">order state</text>
    <text x="440" y="370">payment state</text>
    <text x="440" y="554">signed receipt data</text>
    <text x="440" y="646">digital / printable receipt</text>
    <text x="440" y="830">journal data</text>
    <text x="960" y="508">signature data</text>
    <text x="960" y="784">configuration / updates</text>
  </g>

  
  <g text-anchor="middle" font-size="16" fill="#002A34">
    <text x="960" y="462">country-specific signing</text>
    <text x="960" y="738">upload receipt chain</text>
  </g>
</svg>