<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1880" viewBox="-20 -20 1200 1880" font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Digital receipt via the InStore App</title>
  <desc id="d">The merchant signs and issues the receipt through fiskaltrust. fiskaltrust pushes the receipt to the InStore App, which offers three alternatives: the consumer scans the QR code and the HTML receipt opens on their phone; the consumer acknowledges the receipt with OK; or the receipt is printed, either when the consumer taps Print or, in Consumer mode, when the Print Delay expires without a choice. Every interaction is logged in fiskaltrust.</desc>
  <defs>
    <marker id="open" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M1,1 L11,6 L1,11" fill="none" stroke="#002A34" stroke-width="1.5"/>
    </marker>
    <marker id="solid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#002A34"/>
    </marker>
  </defs>
  <rect x="-20" y="-20" width="1200" height="1880" fill="#FFFFFF"/>
  <g fill="none" stroke-width="1.5" stroke-dasharray="8 6">
    <path d="M220,56 V1840" stroke="#002A34"/>
    <path d="M450,56 V1840" stroke="#007D9A"/>
    <path d="M690,56 V1840" stroke="#002A34"/>
    <path d="M930,56 V1840" stroke="#002A34"/>
  </g>
  <rect x="130" y="0" width="180" height="56" fill="#FFFFFF" stroke="#002A34" stroke-width="1.5"/>
  <text x="220" y="34" text-anchor="middle" font-size="18" font-weight="600" fill="#002A34">merchant</text>
  <rect x="360" y="0" width="180" height="56" fill="#E5F6FB" stroke="#7FCBE2" stroke-width="1.5"/>
  <text x="450" y="34" text-anchor="middle" font-size="18" font-weight="600" fill="#002A34">fiskaltrust</text>
  <rect x="600" y="0" width="180" height="56" fill="#FFFFFF" stroke="#002A34" stroke-width="1.5"/>
  <text x="690" y="34" text-anchor="middle" font-size="18" font-weight="600" fill="#002A34">consumer</text>
  <rect x="840" y="0" width="180" height="56" fill="#FFFFFF" stroke="#002A34" stroke-width="1.5"/>
  <text x="930" y="34" text-anchor="middle" font-size="18" font-weight="600" fill="#002A34">instore-app</text>
  <rect x="10" y="90" width="530" height="250" fill="none" stroke="#002A34" stroke-width="1.5"/>
  <path d="M10,90 H120 V108 L108,120 H10 Z" fill="#E5E6E7" stroke="#002A34" stroke-width="1.5"/>
  <text x="22" y="111" font-family="IBM Plex Mono, monospace" font-size="14" font-weight="600" fill="#002A34">instore</text>
  <path d="M20,120 H177 L195,138 V210 H20 Z" fill="#E5E6E7" stroke="#B9B9BB" stroke-width="1.5"/>
  <path d="M177,120 V138 H195" fill="none" stroke="#B9B9BB" stroke-width="1.5"/>
  <path d="M195,165.0 H220" fill="none" stroke="#002A34" stroke-width="1.5"/>
  <text x="40" y="154" font-size="16" fill="#002A34">collect items,</text>
  <text x="40" y="176" font-size="16" fill="#002A34">process payment</text>
  <text x="40" y="198" font-size="16" fill="#002A34">or checkout</text>
  <path d="M220,260 H448" fill="none" stroke="#002A34" stroke-width="1.5" marker-end="url(#open)"/>
  <text x="335.0" y="248" text-anchor="middle" font-size="16" fill="#002A34">sign receipt</text>
  <path d="M220,310 H448" fill="none" stroke="#002A34" stroke-width="1.5" marker-end="url(#open)"/>
  <text x="335.0" y="298" text-anchor="middle" font-size="16" fill="#002A34">issue receipt</text>
  <rect x="20" y="380" width="1150" height="1440" fill="none" stroke="#002A34" stroke-width="1.5"/>
  <path d="M20,380 H90 V398 L78,410 H20 Z" fill="#E5E6E7" stroke="#002A34" stroke-width="1.5"/>
  <text x="32" y="401" font-family="IBM Plex Mono, monospace" font-size="14" font-weight="600" fill="#002A34">alt</text>
  <text x="104" y="402" font-size="15" font-style="italic" fill="#002A34">[scan qr-code]</text>
  <path d="M450,450 H928" fill="none" stroke="#002A34" stroke-width="1.5" marker-end="url(#open)"/>
  <text x="690.0" y="438" text-anchor="middle" font-size="16" fill="#002A34">on push get receipt</text>
  <path d="M930,480 H980 V514 H932" fill="none" stroke="#002A34" stroke-width="1.5" marker-end="url(#open)"/>
  <text x="992" y="486" font-size="16" fill="#002A34">generate display</text>
  <text x="992" y="506" font-size="16" fill="#002A34">qr-code (https</text>
  <text x="992" y="526" font-size="16" fill="#002A34">receipt link)</text>
  <path d="M490,546 H662 L680,564 V614 H490 Z" fill="#E5E6E7" stroke="#B9B9BB" stroke-width="1.5"/>
  <path d="M662,546 V564 H680" fill="none" stroke="#B9B9BB" stroke-width="1.5"/>
  <path d="M680,580.0 H690" fill="none" stroke="#002A34" stroke-width="1.5"/>
  <text x="510" y="580" font-size="16" fill="#002A34">scan qr-code</text>
  <text x="510" y="602" font-size="16" fill="#002A34">with mobile phone</text>
  <path d="M690,660 H452" fill="none" stroke="#002A34" stroke-width="1.5" marker-end="url(#open)"/>
  <text x="570.0" y="648" text-anchor="middle" font-size="16" fill="#002A34">get https receipt link</text>
  <path d="M930,710 H452" fill="none" stroke="#002A34" stroke-width="1.5" marker-end="url(#open)"/>
  <text x="690.0" y="698" text-anchor="middle" font-size="16" fill="#002A34">log view</text>
  <path d="M450,760 H688" fill="none" stroke="#002A34" stroke-width="1.5" marker-end="url(#open)"/>
  <text x="570.0" y="748" text-anchor="middle" font-size="16" fill="#002A34">render receipt</text>
  <path d="M450,810 H928" fill="none" stroke="#002A34" stroke-width="1.5" marker-end="url(#open)"/>
  <text x="690.0" y="798" text-anchor="middle" font-size="16" fill="#002A34">on viewed, close qr-code display</text>
  <path d="M690,840 H740 V874 H692" fill="none" stroke="#002A34" stroke-width="1.5" marker-end="url(#open)"/>
  <text x="752" y="846" font-size="16" fill="#002A34">see receipt</text>
  <path d="M490,900 H662 L680,918 V968 H490 Z" fill="#E5E6E7" stroke="#B9B9BB" stroke-width="1.5"/>
  <path d="M662,900 V918 H680" fill="none" stroke="#B9B9BB" stroke-width="1.5"/>
  <path d="M680,934.0 H690" fill="none" stroke="#002A34" stroke-width="1.5"/>
  <text x="510" y="934" font-size="16" fill="#002A34">html receipt</text>
  <text x="510" y="956" font-size="16" fill="#002A34">document</text>
  <path d="M690,1030 H452" fill="none" stroke="#002A34" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#open)"/>
  <text x="570.0" y="1018" text-anchor="middle" font-size="16" fill="#002A34">feedback</text>
  <path d="M20,1070 H1170" fill="none" stroke="#002A34" stroke-width="1.5" stroke-dasharray="8 6"/>
  <text x="34" y="1096" font-size="15" font-style="italic" fill="#002A34">[acknowledge]</text>
  <path d="M690,1140 H928" fill="none" stroke="#002A34" stroke-width="1.5" marker-end="url(#open)"/>
  <text x="810.0" y="1128" text-anchor="middle" font-size="16" fill="#002A34">acknowledge receipt (OK)</text>
  <path d="M930,1190 H452" fill="none" stroke="#002A34" stroke-width="1.5" marker-end="url(#open)"/>
  <text x="690.0" y="1178" text-anchor="middle" font-size="16" fill="#002A34">acknowledge receipt</text>
  <path d="M450,1220 H500 V1254 H452" fill="none" stroke="#002A34" stroke-width="1.5" marker-end="url(#open)"/>
  <text x="512" y="1226" font-size="16" fill="#002A34">log view</text>
  <path d="M450,1300 H928" fill="none" stroke="#002A34" stroke-width="1.5" marker-end="url(#open)"/>
  <text x="690.0" y="1288" text-anchor="middle" font-size="16" fill="#002A34">on viewed, close display</text>
  <path d="M20,1370 H1170" fill="none" stroke="#002A34" stroke-width="1.5" stroke-dasharray="8 6"/>
  <text x="34" y="1396" font-size="15" font-style="italic" fill="#002A34">[print receipt]</text>
  <rect x="660" y="1420" width="490" height="170" fill="none" stroke="#002A34" stroke-width="1.5"/>
  <path d="M660,1420 H720 V1438 L708,1450 H660 Z" fill="#E5E6E7" stroke="#002A34" stroke-width="1.5"/>
  <text x="672" y="1441" font-family="IBM Plex Mono, monospace" font-size="14" font-weight="600" fill="#002A34">alt</text>
  <text x="734" y="1442" font-size="15" font-style="italic" fill="#002A34">[consumer taps Print]</text>
  <path d="M690,1485 H928" fill="none" stroke="#002A34" stroke-width="1.5" marker-end="url(#open)"/>
  <text x="810.0" y="1473" text-anchor="middle" font-size="16" fill="#002A34">print receipt</text>
  <path d="M660,1510 H1150" fill="none" stroke="#002A34" stroke-width="1.5" stroke-dasharray="8 6"/>
  <text x="674" y="1536" font-size="15" font-style="italic" fill="#002A34">[no option chosen, Consumer mode]</text>
  <path d="M930,1542 H980 V1576 H932" fill="none" stroke="#002A34" stroke-width="1.5" marker-end="url(#open)"/>
  <text x="992" y="1548" font-size="16" fill="#002A34">Print Delay expires</text>
  <path d="M930,1620 H980 V1654 H932" fill="none" stroke="#002A34" stroke-width="1.5" marker-end="url(#open)"/>
  <text x="992" y="1626" font-size="16" fill="#002A34">print receipt</text>
  <path d="M930,1670 H980 V1704 H932" fill="none" stroke="#002A34" stroke-width="1.5" marker-end="url(#open)"/>
  <text x="992" y="1676" font-size="16" fill="#002A34">on printed,</text>
  <text x="992" y="1696" font-size="16" fill="#002A34">close display</text>
  <path d="M930,1750 H452" fill="none" stroke="#002A34" stroke-width="1.5" marker-end="url(#open)"/>
  <text x="690.0" y="1738" text-anchor="middle" font-size="16" fill="#002A34">print</text>
  <path d="M450,1770 H500 V1804 H452" fill="none" stroke="#002A34" stroke-width="1.5" marker-end="url(#open)"/>
  <text x="512" y="1776" font-size="16" fill="#002A34">log print</text>
</svg>
