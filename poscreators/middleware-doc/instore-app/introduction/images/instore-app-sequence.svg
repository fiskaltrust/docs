  <path d="M20,1090 H1170" fill="none" stroke="#002A34" stroke-width="1.5" stroke-dasharray="8 6"/>
  <text x="34" y="1116" font-size="15" font-style="italic" fill="#002A34">[acknowledge]</text>
  <path d="M690,1160 H928" fill="none" stroke="#002A34" stroke-width="1.5" marker-end="url(#open)"/>
  <text x="810.0" y="1148" text-anchor="middle" font-size="16" fill="#002A34">acknowledge receipt (OK)</text>
  <path d="M930,1210 H452" fill="none" stroke="#002A34" stroke-width="1.5" marker-end="url(#open)"/>
  <text x="690.0" y="1198" text-anchor="middle" font-size="16" fill="#002A34">acknowledge receipt</text>
  <path d="M450,1240 H500 V1274 H452" fill="none" stroke="#002A34" stroke-width="1.5" marker-end="url(#open)"/>
  <text x="512" y="1246" font-size="16" fill="#002A34">log view</text>
  <path d="M450,1320 H928" fill="none" stroke="#002A34" stroke-width="1.5" marker-end="url(#open)"/>
  <text x="690.0" y="1308" text-anchor="middle" font-size="16" fill="#002A34">on viewed, close display</text>
  <path d="M20,1390 H1170" fill="none" stroke="#002A34" stroke-width="1.5" stroke-dasharray="8 6"/>
  <text x="34" y="1416" font-size="15" font-style="italic" fill="#002A34">[send via email]</text>
  <path d="M690,1460 H928" fill="none" stroke="#002A34" stroke-width="1.5" marker-end="url(#open)"/>
  <text x="810.0" y="1448" text-anchor="middle" font-size="16" fill="#002A34">tap Send by Email</text>
  <path d="M930,1490 H980 V1524 H932" fill="none" stroke="#002A34" stroke-width="1.5" marker-end="url(#open)"/>
  <text x="992" y="1496" font-size="16" fill="#002A34">show input screen</text>
  <path d="M690,1570 H928" fill="none" stroke="#002A34" stroke-width="1.5" marker-end="url(#open)"/>
