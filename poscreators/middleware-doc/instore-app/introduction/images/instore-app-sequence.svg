  <text x="450" y="34" text-anchor="middle" font-size="18" font-weight="600" fill="#002A34">fiskaltrust</text>
  <rect x="600" y="0" width="180" height="56" fill="#FFFFFF" stroke="#002A34" stroke-width="1.5"/>
  <text x="690" y="34" text-anchor="middle" font-size="18" font-weight="600" fill="#002A34">consumer</text>
  <rect x="840" y="0" width="180" height="56" fill="#FFFFFF" stroke="#002A34" stroke-width="1.5"/>
  <text x="930" y="34" text-anchor="middle" font-size="18" font-weight="600" fill="#002A34">instore-app</text>
  <rect x="10" y="90" width="530" height="270" fill="none" stroke="#002A34" stroke-width="1.5"/>
  <path d="M10,90 H120 V108 L108,120 H10 Z" fill="#E5E6E7" stroke="#002A34" stroke-width="1.5"/>
  <text x="22" y="111" font-family="IBM Plex Mono, monospace" font-size="14" font-weight="600" fill="#002A34">instore</text>
  <path d="M30,140 H177 L195,158 V230 H30 Z" fill="#E5E6E7" stroke="#B9B9BB" stroke-width="1.5"/>
  <path d="M177,140 V158 H195" fill="none" stroke="#B9B9BB" stroke-width="1.5"/>
  <path d="M195,185.0 H220" fill="none" stroke="#002A34" stroke-width="1.5"/>
  <text x="50" y="174" font-size="16" fill="#002A34">collect items,</text>
  <text x="50" y="196" font-size="16" fill="#002A34">process payment</text>
  <text x="50" y="218" font-size="16" fill="#002A34">or checkout</text>
  <path d="M220,280 H448" fill="none" stroke="#002A34" stroke-width="1.5" marker-end="url(#open)"/>
  <text x="335.0" y="268" text-anchor="middle" font-size="16" fill="#002A34">sign receipt</text>
