  <text x="734" y="2062" font-size="15" font-style="italic" fill="#002A34">[consumer taps Print]</text>
  <path d="M690,2105 H928" fill="none" stroke="#002A34" stroke-width="1.5" marker-end="url(#open)"/>
  <text x="810.0" y="2093" text-anchor="middle" font-size="16" fill="#002A34">print receipt</text>
  <path d="M660,2130 H1150" fill="none" stroke="#002A34" stroke-width="1.5" stroke-dasharray="8 6"/>
  <text x="674" y="2156" font-size="15" font-style="italic" fill="#002A34">[no option chosen, Consumer mode]</text>
