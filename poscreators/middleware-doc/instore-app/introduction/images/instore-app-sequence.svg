<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2500" viewBox="-20 -20 1200 2500" font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Digital receipt via the InStore App</title>
  <desc id="d">The merchant signs and issues the receipt through fiskaltrust. fiskaltrust pushes the receipt to the InStore App, which offers five alternatives: the consumer scans the QR code and the HTML receipt opens on their phone; the consumer acknowledges the receipt with OK; the consumer has the receipt sent by email or SMS; or the receipt is printed, either when the consumer taps Print or, in Consumer mode, when the Print Delay expires without a choice. Every interaction is logged in fiskaltrust.</desc>
  <defs>
    <marker id="open" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M1,1 L11,6 L1,11" fill="none" stroke="#002A34" stroke-width="1.5"/>
    </marker>
    <marker id="solid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#002A34"/>
    </marker>
  </defs>
  <rect x="-20" y="-20" width="1200" height="2500" fill="#FFFFFF"/>
  <g fill="none" stroke-width="1.5" stroke-dasharray="8 6">
    <path d="M220,56 V2460" stroke="#002A34"/>
    <path d="M450,56 V2460" stroke="#007D9A"/>
    <path d="M690,56 V2460" stroke="#002A34"/>
    <path d="M930,56 V2460" stroke="#002A34"/>
  </g>
  <rect x="130" y="0" width="180" height="56" fill="#FFFFFF" stroke="#002A34" stroke-width="1.5"/>
