# .github/workflows/notify-businesscase.yml
# Place this file in the fiskaltrust/docs repository.
#
# Triggers whenever files under poscreators/middleware-doc/ change on main,
# then opens a PR in fiskaltrust/businesscase with those changes applied.
#
# docs is the source of truth for the Middleware documentation; businesscase
# keeps a mirror in doc/compliance-middleware/ (for its PDFs and samples).
# The PR keeps that mirror up to date; merge it as long as the diff only
# contains the docs changes.
#
# Required secret in fiskaltrust/docs:
#   BUSINESSCASE_SYNC_TOKEN — a GitHub PAT (or fine-grained token) with:
#     - Contents: Read & Write  (on fiskaltrust/businesscase)
#     - Pull requests: Read & Write (on fiskaltrust/businesscase)

name: Notify businesscase of docs changes

on:
  push:
    branches:
      - main
    paths:
      - 'poscreators/middleware-doc/**'
  workflow_dispatch:

jobs:
  notify:
    name: Open PR in fiskaltrust/businesscase
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout docs
        uses: actions/checkout@v4
        with:
          path: docs

      - name: Checkout fiskaltrust/businesscase
        uses: actions/checkout@v4
        with:
          repository: fiskaltrust/businesscase
          token: ${{ secrets.BUSINESSCASE_SYNC_TOKEN }}
          path: businesscase

      - name: Apply changes to businesscase
        run: |
          # Mirror general/ subfolder
          rsync -av --delete \
            docs/poscreators/middleware-doc/general/ \
            businesscase/doc/compliance-middleware/general/

          # Mirror all middleware-* subfolders
          for dir in docs/poscreators/middleware-doc/middleware-*/; do
            folder_name=$(basename "$dir")
            rsync -av --delete \
              "$dir" \
              "businesscase/doc/compliance-middleware/$folder_name/"
          done

      - name: Check for changes
        id: diff
        run: |
          cd businesscase
          git diff --quiet && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Get triggering commit info
        if: steps.diff.outputs.changed == 'true'
        id: commit_info
        run: |
          cd docs
          echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "msg=$(git log -1 --pretty=%s)" >> $GITHUB_OUTPUT
          echo "author=$(git log -1 --pretty=%an)" >> $GITHUB_OUTPUT

      - name: Open or update PR in fiskaltrust/businesscase
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.BUSINESSCASE_SYNC_TOKEN }}
          path: businesscase
          branch: sync/docs-middleware-doc
          base: main
          commit-message: |
            sync: mirror middleware-doc from fiskaltrust/docs

            Source commit: fiskaltrust/docs@${{ steps.commit_info.outputs.sha }}
            Author: ${{ steps.commit_info.outputs.author }}
            "${{ steps.commit_info.outputs.msg }}"
          title: "sync: mirror middleware-doc from fiskaltrust/docs"
          body: |
            `poscreators/middleware-doc/` changed in [fiskaltrust/docs](https://github.com/fiskaltrust/docs), the source of truth for the Middleware documentation.

            This PR mirrors the change to `doc/compliance-middleware/`. Do not edit these files in `businesscase`: change them in `docs` instead, or the next sync overwrites the edit.

            ---
            **Source commit:** fiskaltrust/docs@${{ steps.commit_info.outputs.sha }}
            **Author:** ${{ steps.commit_info.outputs.author }}
            **Message:** ${{ steps.commit_info.outputs.msg }}
          labels: automated-sync
          delete-branch: false
